<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>悬账单 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/悬账单.html" class="亮">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>悬账单</h1>
        <p class="说明">对齐后仅单边有键（或需人工处理）的业务键。不是闸对/缝包那种「旁路匣」命名。逐笔形态下同一业务键可能因逐笔缺对位而生成多条悬账。</p>
        <div class="工具条"><button class="次" id="刷">刷新</button></div>
        <div class="标签行" id="形态牌"></div>
      </section>
      <section class="行卡"><div id="表"></div></section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const 形名 = { 汇总: "形态甲 · 键汇总", 逐笔: "形态乙 · 事件逐笔" };
  const paint = async () => {
    const s = await get("/api/同键多笔/形态");
    document.getElementById("形态牌").innerHTML =
      `<span class="标签">当前同键形态：${形名[s.形态] || "未择定"}</span>
       <span class="标签">轮次：${s.轮次 || "未跑对齐"}</span>`;
    const rows = await get("/api/悬账单");
    document.getElementById("表").innerHTML = 表(
      ["编号","业务键","悬边","金额分","事件编号","原因","时刻"],
      rows,
      r => `<td>${r.编号}</td><td>${r.业务键}</td><td>${徽(r.悬边)}</td><td>${r.金额分}</td>
        <td>${r.事件编号||"-"}</td><td>${r.原因}</td><td>${r.时刻}</td>`
    );
  };
  await paint();
  document.getElementById("刷").onclick = paint;
})();
</script>
</body>
</html>
